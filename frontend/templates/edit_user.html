<!DOCTYPE html>
<html>
<head>
    <title>Edit User</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light p-5">
    <div class="container">
<h2>Edit User: {{ user.first_name }}</h2>
        {% if messages %}
            {% for message in messages %}
                <div class="alert alert-success">{{ message }}</div>
            {% endfor %}
        {% endif %}
        <form method="POST" enctype="multipart/form-data">
            {% csrf_token %}
            <div class="mb-3">{{ form.first_name.label_tag }} {{ form.first_name }}</div>
            <div class="mb-3">{{ form.email.label_tag }} {{ form.email }}</div>
            <div class="mb-3">{{ form.image.label_tag }} {{ form.image }}</div>
            <button type="submit" class="btn btn-primary">Update User</button>
            <a href="{% url 'user_list' %}" class="btn btn-secondary">Cancel</a>
        </form>
    </div>
</body>
</html>
