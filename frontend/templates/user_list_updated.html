<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User List</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Font Awesome -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">

    <style>
        body {
            background: #f5f7fa;
            font-family: 'Segoe UI', sans-serif;
        }

        .container-box {
            background: #fff;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.08);
            margin-top: 40px;
        }

        .table img {
            border-radius: 8px;
            object-fit: cover;
        }

        .no-data {
            text-align: center;
            color: #888;
            font-weight: 500;
        }

        .upload-box {
            margin-top: 25px;
            padding: 20px;
            border: 2px dashed #ccc;
            border-radius: 10px;
            text-align: center;
            background: #fafafa;
        }

        .upload-box:hover {
            border-color: #0d6efd;
            background: #f0f7ff;
        }
    </style>
</head>

<body>

<div class="container">
    <div class="container-box">

        <!-- Header -->
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h4><i class="fas fa-users me-2"></i>User List</h4>
            <a href="{% url 'create_user' %}" class="btn btn-primary">
                <i class="fas fa-user-plus"></i> Add User
            </a>
        </div>

        <!-- User Table -->
        <div class="table-responsive">
            <table class="table table-hover align-middle">
                <thead class="table-dark">
                    <tr>
                        <th>ID</th>
                        <th>Name</th>
                        <th>Email</th>
                        <th>Image</th>
                    </tr>
                </thead>
                <tbody>
                    {% for user in users %}
                    <tr>
                        <td>{{ user.id|default:user.0 }}</td>

                        <td>
                            {{ user.name|default:user.1 }}
                        </td>

                        <td>
                            {{ user.email|default:user.2 }}
                        </td>

                        <td>
                            {% if user.image %}
                                <a href="{{ MEDIA_URL }}{{ user.image }}" target="_blank" rel="noopener" style="text-decoration: none;">
                                    <img src="{{ MEDIA_URL }}{{ user.image }}" width="60" height="60" style="cursor: pointer;">
                                </a>
                            {% else %}
                                <span class="text-muted">No Image</span>
                            {% endif %}
                        </td>
                    </tr>

                    {% empty %}
                    <tr>
                        <td colspan="4" class="no-data">
                            <i class="fas fa-info-circle"></i> No users found
                        </td>
                    </tr>
                    {% endfor %}
                </tbody>
            </table>
        </div>

        <!-- Upload Excel -->
        <div class="upload-box mt-4">
            <h6 class="mb-3"><i class="fas fa-file-excel me-2"></i>Upload Excel File</h6>

            <form method="POST" enctype="multipart/form-data" action="{% url 'upload_excel' %}">
                {% csrf_token %}

                <div class="input-group">
                    <input type="file" class="form-control" name="file" required>
                    <button class="btn btn-success">
                        <i class="fas fa-upload"></i> Upload
                    </button>
                </div>
            </form>
        </div>

    </div>
</div>

</body>
</html>
